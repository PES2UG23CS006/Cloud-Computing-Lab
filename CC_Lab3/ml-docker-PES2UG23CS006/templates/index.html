<!DOCTYPE html>
<html>
<head>
    <title>Spam Detection ML App</title>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9;">
    
    <h1 style="color: #333;">PES2UG23CS006</h1>
    <h2 style="color: #666; margin-bottom: 30px;">Spam Detection using ML (Dockerized)</h2>

    <form method="POST" style="margin-top: 20px;">
        <input type="text" name="message" placeholder="Enter message" required 
               style="padding: 10px; width: 300px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;">
        <br><br>
        
        <button type="submit" 
                style="padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">
            Predict
        </button>
    </form>

    {% if result %}
        <h3 style="color: #0056b3; margin-top: 30px;">Prediction: {{ result }}</h3>
    {% endif %}

</body>
</html>
